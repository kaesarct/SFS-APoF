<div class="max-w-2xl mx-auto animate-fade-in-up">
  <div class="bg-white p-8 rounded-xl shadow-lg border border-gray-100 text-center">
    <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
        </path>
      </svg>
    </div>

    <h2 class="text-2xl font-bold text-gray-900 mb-4">Inviaci i tuoi dati</h2>
    <p class="text-gray-600 mb-8 leading-relaxed">
      Vuoi contribuire al progetto fornendo nuovi dati?<br>
      Invia una foto o uno screenshot a questo indirizzo email<br>
      specificando il <strong>Paese</strong>, la <strong>Data</strong> e il <strong>Prezzo</strong> rilevato.
    </p>

    <a [href]="'mailto:' + email + '?subject=Nuova%20Rilevazione%20Nutella%20Index'"
      class="inline-flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 transition-colors shadow-md">
      Invia a {{ email }}
    </a>

    <p class="mt-8 text-sm text-gray-400">
      Grazie per il tuo contributo!
    </p>
  </div>
</div>
