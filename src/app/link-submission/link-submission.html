<div class="max-w-2xl mx-auto animate-fade-in-up">
  <div class="bg-white p-8 rounded-xl shadow-lg border border-gray-100">
    <h2 class="text-2xl font-bold text-gray-900 mb-2">Invia una Risorsa</h2>
    <p class="text-gray-500 mb-8">Hai trovato un rapporto o un dataset rilevante? Faccelo sapere.</p>

    <!-- Success Message -->
    <div *ngIf="successMessage"
      class="mb-6 p-4 bg-green-50 border border-green-200 text-green-700 rounded-lg flex items-center">
      <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
      </svg>
      {{ successMessage }}
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage"
      class="mb-6 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg flex items-center">
      <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      {{ errorMessage }}
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">
      <div>
        <label for="url" class="block text-sm font-medium text-gray-700 mb-1">Indirizzo URL</label>
        <input type="url" id="url" formControlName="url" placeholder="https://example.com/report"
          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all placeholder-gray-400"
          [class.border-red-500]="form.get('url')?.invalid && form.get('url')?.touched">
        <div *ngIf="form.get('url')?.invalid && form.get('url')?.touched" class="text-red-500 text-sm mt-1">
          Inserisci un URL valido che inizi con http:// o https://
        </div>
      </div>

      <button type="submit" [disabled]="form.invalid || submitting"
        class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300 text-white font-semibold py-3 px-6 rounded-lg transition-colors shadow-md flex justify-center items-center">
        <span *ngIf="submitting" class="animate-spin rounded-full h-5 w-5 border-b-2 border-white mr-2"></span>
        {{ submitting ? 'Invio in corso...' : 'Invia Link' }}
      </button>
    </form>
  </div>
</div>
