<div class="flex items-center justify-center min-h-[80vh] animate-fade-in-up">
  <div class="bg-white p-8 rounded-xl shadow-lg border border-gray-100 w-full max-w-md">
    <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">Accesso Amministratore</h2>

    <div *ngIf="error" class="mb-4 p-3 bg-red-50 text-red-600 rounded text-sm text-center">
      {{ error }}
    </div>

    <form (ngSubmit)="login()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input [(ngModel)]="email" name="email" type="email" required
          class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input [(ngModel)]="password" name="password" type="password" required
          class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <button type="submit" [disabled]="loading"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors flex justify-center">
        <span *ngIf="loading" class="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></span>
        <span *ngIf="!loading">Accedi</span>
      </button>
    </form>
  </div>
</div>
